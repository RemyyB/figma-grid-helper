<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
    --text: var(--figma-color-text, #1e1e1e);
    --text2: var(--figma-color-text-secondary, #757575);
    --text3: var(--figma-color-text-tertiary, #b3b3b3);
    --border: var(--figma-color-border, #e6e6e6);
    --border-strong: var(--figma-color-border-strong, #c4c4c4);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-hover: var(--figma-color-bg-brand-hover, #007be5);
    --brand-text: var(--figma-color-text-brand, #007be5);
    --onbrand: var(--figma-color-text-onbrand, #ffffff);
    --danger: var(--figma-color-text-danger, #dc3412);
    --danger-bg: var(--figma-color-bg-danger-tertiary, #ffe2e0);
    --success: var(--figma-color-text-success, #14ae5c);
    --disabled-bg: var(--figma-color-bg-disabled, #d9d9d9);
    --disabled-text: var(--figma-color-text-disabled, #b3b3b3);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 11px/16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  main { flex: 1; overflow-y: auto; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
  }

  .row { display: flex; gap: 8px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }

  /* Figma-style fields */
  .field {
    display: flex;
    align-items: center;
    height: 28px;
    background: var(--bg2);
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 0 0 0 8px;
  }
  .field:hover { border-color: var(--border); }
  .field:focus-within { border-color: var(--brand); }
  .field span {
    color: var(--text2);
    white-space: nowrap;
    padding-right: 6px;
  }
  .field input, .field select {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-variant-numeric: tabular-nums;
    outline: none;
    padding: 0 8px 0 0;
  }
  .field select { cursor: pointer; padding-right: 4px; }
  .field input::-webkit-inner-spin-button,
  .field input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .field input[type="number"] { -moz-appearance: textfield; }
  .figma-dark { color-scheme: dark; }
  .field .tag { font-style: normal; color: var(--text3); padding-right: 8px; white-space: nowrap; }
  .field.locked, .field.locked:hover, .field.locked:focus-within { background: transparent; border: 1px dashed var(--border-strong); }
  .field.locked input { color: var(--text2); cursor: default; }
  .muted { color: var(--text2); }

  .segmented {
    display: flex;
    background: var(--bg2);
    border-radius: 5px;
    padding: 2px;
    flex: 1;
  }
  .segmented button {
    flex: 1;
    height: 24px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text2);
    font: inherit;
    cursor: pointer;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--bg);
    color: var(--text);
    box-shadow: 0 0 0 1px var(--border);
  }

  .summary {
    margin: 10px 0 0;
    color: var(--text2);
    font-variant-numeric: tabular-nums;
  }
  .summary b { color: var(--text); font-weight: 600; }
  .invalid { color: var(--danger); }

  .notice {
    margin: 12px 16px 0;
    padding: 8px 10px;
    border-radius: 5px;
    background: var(--danger-bg);
    color: var(--danger);
  }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    position: sticky;
    top: 0;
    background: var(--bg);
    color: var(--text2);
    font-weight: 400;
    text-align: left;
    height: 32px;
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }
  td { height: 28px; }
  th:first-child, td:first-child { width: 36px; padding-left: 16px; }
  th:last-child, td:last-child { padding-right: 16px; }
  .num { text-align: right; width: 72px; }
  tbody tr:hover td { background: var(--bg-hover); }
  tr.group td {
    height: 32px;
    padding-top: 8px;
    color: var(--text2);
    font-weight: 600;
    background: var(--bg) !important;
  }
  tr.same td { color: var(--text3); }
  tr.same td.name { color: var(--text2); }
  td.next { font-weight: 600; }
  tr.changed td.next, tr.new td.next { color: var(--brand-text); }
  tr.same td.next { font-weight: 400; }
  td.name { white-space: nowrap; }
  .pill {
    display: inline-block;
    margin-left: 6px;
    padding: 0 5px;
    border-radius: 3px;
    font-size: 9px;
    line-height: 14px;
    text-transform: uppercase;
    letter-spacing: .04em;
    background: var(--bg2);
    color: var(--text2);
    vertical-align: 1px;
  }
  .pill.new { background: var(--brand); color: var(--onbrand); }
  .pill.link { text-transform: none; letter-spacing: 0; font-size: 10px; }
  tr.linked td { color: var(--text2); }
  tr.linked td.next { font-weight: 400; color: var(--text); }
  .pill.mode { background: transparent; color: var(--brand-text); box-shadow: inset 0 0 0 1px var(--brand-text); }

  .t-spacers th:first-child, .t-spacers td:first-child { width: auto; }
  .hint { margin: 4px 0 0; color: var(--text2); }

  input[type="checkbox"] {
    margin: 0;
    width: 14px;
    height: 14px;
    accent-color: var(--brand);
    cursor: pointer;
    vertical-align: middle;
  }
  input[type="checkbox"]:disabled { cursor: default; opacity: .35; }

  footer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  button.btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 5px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-strong);
  }
  .btn.secondary:hover { background: var(--bg-hover); }
  .btn.primary {
    flex: 1;
    background: var(--brand);
    color: var(--onbrand);
    border: 0;
  }
  .btn.primary:hover { background: var(--brand-hover); }
  .btn.primary:disabled {
    background: var(--disabled-bg);
    color: var(--disabled-text);
    cursor: default;
  }

  .empty { padding: 24px 16px; color: var(--text2); }
</style>
</head>
<body>
<main>
  <div id="notice" class="notice" hidden></div>

  <section>
    <div class="grid2">
      <label class="field"><span>Mode</span><select id="mode"></select></label>
      <div class="segmented" id="tabs" role="group" aria-label="Section">
        <button data-tab="grid" aria-pressed="true">Grid</button>
        <button data-tab="spacers" aria-pressed="false">Spacers</button>
      </div>
      <label class="field" id="collectionField" hidden><span>Set</span><select id="collection"></select></label>
    </div>
  </section>

  <div id="tab-grid">
  <section>
    <div class="grid2">
      <label class="field" title="Container width (grid/col/col-12)" data-title="Container width (grid/col/col-12)"><span>col-12</span><input id="W" type="number" step="1" min="1"><em class="tag" id="W-tag"></em></label>
      <label class="field" title="grid/gutter" data-title="grid/gutter"><span>Gutter</span><input id="g" type="number" step="1" min="0"><em class="tag" id="g-tag"></em></label>
      <label class="field" title="grid/col/columns" data-title="grid/col/columns"><span>Columns</span><input id="C" type="number" step="1" min="1"><em class="tag" id="C-tag"></em></label>
      <label class="field" title="Used for grid/margin/margin = (page width − col-12) / 2"><span>Page</span><input id="P" type="number" step="1" min="1"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="segmented" id="rounding" role="group" aria-label="Rounding">
        <button data-r="nearest" aria-pressed="false">Round</button>
        <button data-r="floor" aria-pressed="true">Floor</button>
        <button data-r="none" aria-pressed="false">Off (0.01)</button>
      </div>
    </div>
    <p class="summary" id="summary"></p>
  </section>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="all" title="Select all changes"></th>
        <th>Variable</th>
        <th class="num">Current</th>
        <th class="num">New</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  </div>

  <div id="tab-spacers" hidden>
    <section>
      <p class="summary" id="spacerSummary" style="margin:0"></p>
      <p class="hint" id="spacerHint"></p>
    </section>
    <table class="t-spacers">
      <thead>
        <tr>
          <th>Spacer</th>
          <th class="num">Value</th>
          <th class="num">Negative</th>
          <th class="num">New</th>
        </tr>
      </thead>
      <tbody id="spacerRows"></tbody>
    </table>
  </div>

  <div id="empty" class="empty" hidden>Loading variables…</div>
</main>

<footer>
  <button class="btn secondary" id="reset" title="Reload values from variables">Reset</button>
  <button class="btn primary" id="apply" disabled>Update</button>
</footer>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var data = null;
  var rounding = 'floor';
  var overrides = {};   // variable name -> checked, set by the user
  var busy = false;
  var currentRows = [];
  var tab = 'grid';
  var spacerCount = 0;  // negative spacer variables that need creating or fixing

  function post(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }

  // ---------- math (same as in code.js) ----------
  function clean(x) { return Math.round(x * 1000) / 1000; }
  function roundValue(x, r) {
    var v = clean(x);
    if (r === 'floor') return Math.floor(v);
    if (r === 'none') return Math.round(v * 100) / 100;
    return Math.round(v);
  }
  function spanWidth(n, W, g, C) {
    if (n >= C) return W;
    var col = (W - (C - 1) * g) / C;
    return n * col + (n - 1) * g;
  }
  function negate(v) { return v === 0 ? 0 : -v; }

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return String(parseFloat(Number(n).toFixed(2)));
  }
  function num(id) { return parseFloat($(id).value); }

  // ---------- inputs ----------
  function fillSelects() {
    $('mode').innerHTML = data.modes.map(function (m) {
      return '<option value="' + m.modeId + '"' + (m.modeId === data.modeId ? ' selected' : '') + '>' + escapeHtml(m.name) + '</option>';
    }).join('');
    $('collection').innerHTML = data.collections.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === data.collectionId ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
    }).join('');
    $('collectionField').hidden = data.collections.length < 2;
  }

  function fillInputs() {
    var b = data.base;
    $('W').value = b.col12.value !== null ? b.col12.value : '';
    $('g').value = b.gutter.value !== null ? b.gutter.value : 0;
    $('C').value = b.columns.value !== null ? b.columns.value : 12;
    $('P').value = b.pageWidth.value !== null ? b.pageWidth.value : data.fallbackPageWidth;
  }

  function validate(W, g, C, P) {
    if (!(W > 0)) return 'col-12 must be larger than 0.';
    if (!(g >= 0)) return 'Gutter can\'t be negative.';
    if (!(C >= 1) || Math.floor(C) !== C) return 'Columns must be a whole number of 1 or more.';
    if ((W - (C - 1) * g) / C <= 0) return 'The gutters don\'t fit inside col-12.';
    if (!(P > 0)) return 'Page width must be larger than 0.';
    return null;
  }

  // ---------- aliases ----------
  function shortName(name) { return String(name || '').replace(/^grid\//, ''); }

  // Value an aliased variable will have after the update: if its alias chain
  // points at something being edited here (e.g. margin → gutter), use the new
  // value; otherwise it keeps its current value.
  function follow(v, pending) {
    for (var i = 0; i < v.aliasPath.length; i++) {
      if (v.aliasPath[i] in pending) return pending[v.aliasPath[i]];
    }
    return v.value;
  }

  // Works out the grid for the selected mode. Aliased variables are never
  // written; they follow their alias. When margin is aliased it drives col-12
  // (col-12 = page − 2 × margin) instead of being calculated from it.
  function model() {
    var b = data.base;
    var pending = {};
    var locked = {};

    function input(id, v) {
      if (v.isAlias) {
        locked[id] = { tag: 'alias', title: 'Follows ' + v.aliasTo + '. Change that variable to change this.' };
        return follow(v, pending);
      }
      return num(id);
    }

    var g = input('g', b.gutter);
    pending[b.gutter.name] = g;
    var C = input('C', b.columns);
    pending[b.columns.name] = C;
    var P = num('P');
    pending[b.pageWidth.name] = P;
    var gn = b.gutterNegative.isAlias ? follow(b.gutterNegative, pending) : negate(roundValue(g, rounding));
    pending[b.gutterNegative.name] = gn;

    var marginDrives = b.margin.isAlias && b.margin.aliasPath.indexOf(b.col12.name) === -1;
    var W, m;
    if (b.col12.isAlias) {
      W = input('W', b.col12);
    } else if (marginDrives) {
      m = follow(b.margin, pending);
      W = P - 2 * m;
      locked.W = { tag: 'auto', title: 'page − 2 × margin (margin follows ' + b.margin.aliasTo + ')' };
    } else {
      W = num('W');
    }
    pending[b.col12.name] = W;

    if (m === undefined) m = b.margin.isAlias ? follow(b.margin, pending) : roundValue((P - W) / 2, rounding);
    pending[b.margin.name] = m;

    return { W: W, g: g, C: C, P: P, m: m, gn: gn, pending: pending, locked: locked };
  }

  // Locked inputs show the value they get from their alias (or from margin).
  function applyLocks(mdl) {
    ['W', 'g', 'C'].forEach(function (id) {
      var lock = mdl.locked[id];
      var el = $(id);
      var field = el.parentNode;
      field.classList.toggle('locked', !!lock);
      el.readOnly = !!lock;
      $(id + '-tag').textContent = lock ? lock.tag : '';
      field.title = lock ? lock.title : field.getAttribute('data-title');
      if (lock) {
        var v = id === 'W' ? mdl.W : id === 'g' ? mdl.g : mdl.C;
        el.value = (v === null || isNaN(v)) ? '' : v;
      }
    });
  }

  // ---------- rows ----------
  function makeRow(v, next, label, creatable) {
    var status;
    if (!v.id) status = creatable ? 'new' : 'missing';
    else if (v.isAlias) status = 'linked';
    else if (v.value === null || Math.abs(next - v.value) > 0.0005) status = 'changed';
    else status = 'same';
    var enabled = status === 'new' || status === 'changed';
    var checked = enabled && (v.name in overrides ? overrides[v.name] : true);
    return {
      name: v.name, id: v.id, n: v.n || null, label: label,
      current: v.value, next: next, isAlias: v.isAlias, aliasTo: v.aliasTo,
      status: status, enabled: enabled, checked: checked
    };
  }

  function computeRows(mdl) {
    var b = data.base;
    var rows = [];
    data.cols.forEach(function (c) {
      var next = c.isAlias ? follow(c, mdl.pending) : roundValue(spanWidth(c.n, mdl.W, mdl.g, mdl.C), rounding);
      rows.push(makeRow(c, next, 'col-' + c.n, true));
    });
    rows.push({ group: 'Grid' });
    rows.push(makeRow(b.gutter, b.gutter.isAlias ? mdl.g : roundValue(mdl.g, rounding), 'gutter', false));
    rows.push(makeRow(b.gutterNegative, mdl.gn, 'gutter-negative', false));
    rows.push(makeRow(b.columns, mdl.C, 'columns', false));
    rows.push(makeRow(b.margin, mdl.m, 'margin', false));
    return rows;
  }

  function modeName() {
    return (data.modes.filter(function (m) { return m.modeId === data.modeId; })[0] || {}).name || '';
  }

  function render() {
    if (!data) return;
    renderGrid();
    renderSpacers();
    updateButton();
  }

  function renderGrid() {
    var mdl = model();
    applyLocks(mdl);
    var W = mdl.W, g = mdl.g, C = mdl.C, P = mdl.P;
    var marginAlias = data.base.margin.isAlias;
    var err = (marginAlias && (mdl.m === null || isNaN(mdl.m)))
      ? 'Couldn\'t resolve the margin alias.'
      : validate(W, g, C, P);

    if (err) {
      $('summary').innerHTML = '<span class="invalid">' + err + '</span>';
      $('rows').innerHTML = '';
      currentRows = [];
      return;
    }

    var colW = (W - (C - 1) * g) / C;
    $('summary').innerHTML =
      '1 column <b>' + fmt(colW) + '</b> · margin <b>' + fmt(mdl.m) + '</b>' +
      (marginAlias ? ' <span class="muted">→ ' + escapeHtml(shortName(data.base.margin.aliasTo)) + '</span>' : '') +
      (mdl.m < 0 ? ' <span class="invalid">(col-12 is wider than the page)</span>' : '');

    currentRows = computeRows(mdl);
    $('rows').innerHTML = currentRows.map(function (r, i) {
      if (r.group) return '<tr class="group"><td></td><td colspan="3">' + r.group + '</td></tr>';
      var pills = '';
      if (r.status === 'new') pills += '<span class="pill new">new</span>';
      if (r.status === 'missing') pills += '<span class="pill">not found</span>';
      if (r.isAlias) pills += '<span class="pill link" title="Alias of ' + escapeHtml(r.aliasTo || '') + '. Follows it, never overwritten.">→ ' + escapeHtml(shortName(r.aliasTo) || 'alias') + '</span>';
      return '<tr class="' + r.status + '">' +
        '<td><input type="checkbox" data-i="' + i + '"' + (r.checked ? ' checked' : '') + (r.enabled ? '' : ' disabled') + '></td>' +
        '<td class="name" title="' + escapeHtml(r.name) + '">' + r.label + pills + '</td>' +
        '<td class="num">' + fmt(r.current) + '</td>' +
        '<td class="num next">' + (r.status === 'missing' ? '' : fmt(r.next)) + '</td>' +
        '</tr>';
    }).join('');

    var enabled = currentRows.filter(function (r) { return r.enabled; });
    var checked = enabled.filter(function (r) { return r.checked; });
    $('all').disabled = enabled.length === 0;
    $('all').checked = enabled.length > 0 && checked.length === enabled.length;
    $('all').indeterminate = checked.length > 0 && checked.length < enabled.length;
  }

  // Negative spacers: preview for the selected mode, count across all modes.
  function renderSpacers() {
    var list = data.spacers || [];
    spacerCount = 0;
    if (!list.length) {
      $('spacerSummary').textContent = 'No variables named spacers/<n> found in this collection.';
      $('spacerHint').textContent = '';
      $('spacerRows').innerHTML = '';
      return;
    }

    var toCreate = 0, toUpdate = 0;
    $('spacerRows').innerHTML = list.map(function (s) {
      var cur = s.modes[data.modeId] || { pos: null, neg: null, negIsAlias: false };
      var target = cur.pos === null ? null : negate(cur.pos);

      var outOfSync = data.modes.filter(function (m) {
        var v = s.modes[m.modeId];
        if (!v || v.pos === null || v.negIsAlias) return false;
        return !s.negId || v.neg === null || Math.abs(v.neg - negate(v.pos)) > 0.0005;
      });
      if (!s.negId) toCreate++;
      else if (outOfSync.length) toUpdate++;

      var status;
      if (!s.negId) status = 'new';
      else if (!cur.negIsAlias && target !== null && (cur.neg === null || Math.abs(cur.neg - target) > 0.0005)) status = 'changed';
      else status = 'same';

      var pills = '';
      if (status === 'new') pills += '<span class="pill new">new</span>';
      if (cur.negIsAlias) pills += '<span class="pill" title="Aliased values are left alone">alias</span>';
      if (s.negId) outOfSync.forEach(function (m) {
        if (m.modeId !== data.modeId) pills += '<span class="pill mode" title="Out of sync in ' + escapeHtml(m.name) + '">' + escapeHtml(m.name) + '</span>';
      });

      return '<tr class="' + status + '">' +
        '<td class="name" title="' + escapeHtml(s.negName) + '">' + escapeHtml(s.key) + pills + '</td>' +
        '<td class="num">' + fmt(cur.pos) + '</td>' +
        '<td class="num">' + (s.negId ? fmt(cur.neg) : '—') + '</td>' +
        '<td class="num next">' + (cur.negIsAlias ? '' : fmt(target)) + '</td>' +
        '</tr>';
    }).join('');

    spacerCount = toCreate + toUpdate;
    var parts = [list.length + ' spacers'];
    if (toCreate) parts.push('<b>' + toCreate + '</b> to create');
    if (toUpdate) parts.push('<b>' + toUpdate + '</b> to update');
    if (!spacerCount) parts.push('negatives in sync');
    $('spacerSummary').innerHTML = parts.join(' · ');
    $('spacerHint').textContent = 'Sets negative/<n> to −<n> in ' +
      data.modes.map(function (m) { return m.name; }).join(' and ') + '. Missing ones are created.';
  }

  function selectedItems() {
    return currentRows.filter(function (r) { return r.enabled && r.checked; });
  }

  function updateButton() {
    var btn = $('apply');
    if (busy) { btn.disabled = true; btn.textContent = 'Updating…'; return; }
    if (!data) { btn.disabled = true; return; }

    if (tab === 'spacers') {
      btn.disabled = spacerCount === 0;
      btn.textContent = spacerCount === 0
        ? 'Negative spacers in sync'
        : 'Sync ' + spacerCount + ' negative spacer' + (spacerCount === 1 ? '' : 's') + ' (all modes)';
      return;
    }

    var count = selectedItems().length;
    btn.disabled = count === 0;
    btn.textContent = count === 0
      ? 'No changes in ' + modeName()
      : 'Update ' + count + ' variable' + (count === 1 ? '' : 's') + ' in ' + modeName();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showNotice(text) { $('notice').textContent = text; $('notice').hidden = !text; }

  // ---------- events ----------
  ['W', 'g', 'C', 'P'].forEach(function (id) { $(id).addEventListener('input', render); });

  document.querySelectorAll('#rounding button').forEach(function (b) {
    b.addEventListener('click', function () {
      rounding = b.getAttribute('data-r');
      document.querySelectorAll('#rounding button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      render();
    });
  });

  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.getAttribute('data-tab');
      document.querySelectorAll('#tabs button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      $('tab-grid').hidden = tab !== 'grid';
      $('tab-spacers').hidden = tab !== 'spacers';
      updateButton();
    });
  });

  $('rows').addEventListener('change', function (e) {
    var i = e.target.getAttribute('data-i');
    if (i === null) return;
    overrides[currentRows[i].name] = e.target.checked;
    render();
  });

  $('all').addEventListener('change', function (e) {
    currentRows.forEach(function (r) { if (r.enabled) overrides[r.name] = e.target.checked; });
    render();
  });

  $('mode').addEventListener('change', function () {
    post({ type: 'load', collectionId: data.collectionId, modeId: $('mode').value });
  });
  $('collection').addEventListener('change', function () {
    post({ type: 'load', collectionId: $('collection').value, modeId: null });
  });
  $('reset').addEventListener('click', function () {
    if (data) post({ type: 'load', collectionId: data.collectionId, modeId: data.modeId });
  });

  $('apply').addEventListener('click', function () {
    if (tab === 'spacers') {
      if (!spacerCount) return;
      busy = true;
      updateButton();
      post({ type: 'syncNegatives', collectionId: data.collectionId, modeId: data.modeId });
      return;
    }
    var items = selectedItems().map(function (r) {
      return { name: r.name, id: r.id, n: r.n, value: r.next };
    });
    if (!items.length) return;
    busy = true;
    updateButton();
    post({ type: 'apply', collectionId: data.collectionId, modeId: data.modeId, rounding: rounding, items: items });
  });

  window.onmessage = function (e) {
    var msg = e.data && e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'data') {
      data = msg;
      busy = false;
      overrides = {};
      showNotice('');
      $('empty').hidden = true;
      fillSelects();
      fillInputs();
      render();
    } else if (msg.type === 'error') {
      busy = false;
      showNotice(msg.message);
      if (!data) $('empty').hidden = true;
      render();
    }
  };

  $('empty').hidden = false;
  post({ type: 'ready' });
</script>
</body>
</html>
